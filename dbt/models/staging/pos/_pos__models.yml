version: 2

models:
  - name: base_pos__receipts
    description: Toan bo hoa don POS da doc va hop nhat 2 phien ban, kem nhan loi dq_issue. Bang trung gian.

  - name: stg_pos__receipts
    description: Hoa don POS hop le (Silver). Giu hoa don huy/hoan tien kem co.
    columns:
      - name: receipt_no
        data_tests: [unique, not_null]
      - name: branch_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('branch_code_map')
                field: branch_id
      - name: business_date
        data_tests: [not_null]
      - name: channel
        data_tests:
          - accepted_values:
              arguments:
                values: ['WALKIN', 'GRABFOOD', 'SHOPEEFOOD']
      - name: pos_version
        data_tests:
          - accepted_values:
              arguments:
                values: ['v2.8.0', 'v3.2.1']
      - name: total_paid
        data_tests: [not_null]

  - name: stg_pos__receipt_lines
    description: Moi dong la 1 mon trong 1 hoa don POS (Silver).
    columns:
      - name: receipt_no
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('stg_pos__receipts')
                field: receipt_no
      - name: item_id
        data_tests: [not_null]
      - name: qty
        data_tests: [not_null]

  - name: silver_quarantine
    description: Cac dong du lieu bi cach ly o tang Silver kem ly do.
